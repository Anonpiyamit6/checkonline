<!doctype html>
<html lang="th">
 <head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ระบบลงชื่อออนไลน์ โรงเรียนบางสะพานวิทยา</title>
  
  <!-- ตราโรงเรียนบนแท็บเบราว์เซอร์ (Favicon) -->
  <link rel="icon" type="image/png" href="https://s.imgz.io/2026/10/06/31ee5db68b3d5c54b65425b0af82e3e7348c032590932d02.png">
  
  <!-- ฟอนต์ Prompt โมเดิร์น -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- Tailwind CSS & SweetAlert2 -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

  <style>
    body {
      font-family: 'Prompt', sans-serif;
    }
    .pastel-bg {
      background: linear-gradient(135deg, #eef9f1 0%, #fdfbf1 50%, #e9f6ef 100%);
    }
    div:where(.swal2-container) .swal2-popup {
      border-radius: 1.75rem !important;
      font-family: 'Prompt', sans-serif !important;
      padding: 2rem 1.5rem !important;
    }
  </style>
 </head>
 <body class="pastel-bg min-h-screen text-slate-800 flex flex-col justify-between selection:bg-emerald-200">

  <!-- Header ด้านบน -->
  <header class="w-full max-w-5xl mx-auto px-6 pt-8 pb-4">
    <div class="flex items-center gap-4">
      <div class="relative group">
        <div class="absolute -inset-1 bg-gradient-to-r from-emerald-300 to-amber-200 rounded-2xl blur opacity-60 group-hover:opacity-100 transition duration-300"></div>
        <div class="relative w-14 h-14 sm:w-16 sm:h-16 bg-white rounded-2xl p-2 shadow-sm flex items-center justify-center border border-emerald-100/80">
          <img src="https://s.imgz.io/2026/10/06/31ee5db68b3d5c54b65425b0af82e3e7348c032590932d02.png" 
               alt="ตราโรงเรียนบางสะพานวิทยา" 
               class="w-full h-full object-contain">
        </div>
      </div>
      <div>
        <span class="inline-block bg-emerald-100 text-emerald-800 text-xs px-2.5 py-0.5 rounded-full font-medium mb-1">กลุ่มงานบริหารงานบุคคล</span>
        <h1 class="text-xl sm:text-2xl font-bold text-slate-800 tracking-tight">ระบบลงชื่อออนไลน์ โรงเรียนบางสะพานวิทยา</h1>
      </div>
    </div>
  </header>

  <!-- ฟอร์มลงเวลา -->
  <main class="w-full max-w-xl mx-auto px-5 py-4">
    <div class="bg-white/85 backdrop-blur-xl border border-white/70 rounded-3xl p-6 sm:p-9 shadow-xl shadow-emerald-950/5 relative overflow-hidden">
      
      <div class="absolute -top-16 -right-16 w-40 h-40 bg-gradient-to-bl from-amber-100/70 to-transparent rounded-full blur-2xl pointer-events-none"></div>

      <!-- หัวข้อและการแสดงวันที่เต็ม -->
      <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 mb-6 relative">
        <div>
          <span class="text-xs font-semibold text-emerald-700 tracking-wider uppercase">Online Attendance</span>
          <h2 class="text-xl font-bold text-slate-800">บันทึกเวลาปฏิบัติงาน</h2>
        </div>
        <div class="inline-flex items-center gap-1.5 self-start sm:self-auto bg-amber-50/80 border border-amber-200/60 px-3.5 py-1.5 rounded-full text-xs font-medium text-amber-900 shadow-sm">
          <svg class="w-3.5 h-3.5 text-amber-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
          <span id="full-date-display">กำลังโหลดวันที่...</span>
        </div>
      </div>

      <!-- กล่องนาฬิกา Real-time -->
      <div class="bg-gradient-to-br from-emerald-600 via-emerald-700 to-teal-800 text-white rounded-2xl p-5 mb-7 shadow-lg shadow-emerald-700/20 relative overflow-hidden">
        <div class="flex justify-between items-center relative z-10">
          <div>
            <p class="text-xs text-emerald-200 font-medium tracking-wide">เวลาปัจจุบันตามเวลาประเทศไทย</p>
            <p id="current-clock" class="text-3xl sm:text-4xl font-extrabold tracking-tight tabular-nums mt-1 text-white">--:--:--</p>
          </div>
          <div class="text-right">
            <span id="status-badge" class="inline-block bg-white/20 backdrop-blur-md border border-white/20 text-emerald-50 px-3 py-1 rounded-xl text-xs font-semibold">
              กำลังตรวจสอบ...
            </span>
          </div>
        </div>
        <div class="mt-3 pt-3 border-t border-white/10 text-xs text-emerald-100 flex items-center justify-between">
          <span id="current-period">ช่วงเวลา: --</span>
          <span class="flex items-center gap-1.5"><span class="w-2 h-2 rounded-full bg-amber-300 animate-pulse"></span> ระบบทำงานปกติ</span>
        </div>
      </div>

      <!-- ฟอร์มกรอกข้อมูล -->
      <form id="attendance-form" novalidate class="space-y-5">
        
        <!-- ส่วนที่อัปเกรด: แยกคำนำหน้า - ชื่อ - นามสกุล -->
        <div>
          <label class="block text-sm font-semibold text-slate-700 mb-2">ข้อมูลผู้ลงชื่อ</label>
          <div class="grid grid-cols-1 sm:grid-cols-12 gap-2.5">
            <!-- คำนำหน้าชื่อ (Dropdown) -->
            <div class="sm:col-span-4">
              <select id="prefix" name="prefix" required
                      class="w-full rounded-2xl border border-slate-200/90 bg-slate-50/50 px-3.5 py-3.5 text-slate-800 focus:bg-white focus:border-emerald-400 focus:ring-4 focus:ring-emerald-100 outline-none transition duration-200 cursor-pointer">
                <option value="" disabled selected>คำนำหน้า...</option>
                <option value="นาย">นาย</option>
                <option value="นาง">นาง</option>
                <option value="นางสาว">นางสาว</option>
                <option value="ว่าที่ร้อยตรี">ว่าที่ร้อยตรี</option>
              </select>
            </div>
            <!-- ชื่อ -->
            <div class="sm:col-span-4">
              <input id="first-name" name="first_name" type="text" autocomplete="given-name" required maxlength="60" 
                     placeholder="ชื่อ" 
                     class="w-full rounded-2xl border border-slate-200/90 bg-slate-50/50 px-4 py-3.5 text-slate-800 placeholder:text-slate-400 focus:bg-white focus:border-emerald-400 focus:ring-4 focus:ring-emerald-100 outline-none transition duration-200">
            </div>
            <!-- นามสกุล -->
            <div class="sm:col-span-4">
              <input id="last-name" name="last_name" type="text" autocomplete="family-name" required maxlength="60" 
                     placeholder="นามสกุล" 
                     class="w-full rounded-2xl border border-slate-200/90 bg-slate-50/50 px-4 py-3.5 text-slate-800 placeholder:text-slate-400 focus:bg-white focus:border-emerald-400 focus:ring-4 focus:ring-emerald-100 outline-none transition duration-200">
            </div>
          </div>
        </div>

        <!-- กลุ่มสาระการเรียนรู้ -->
        <div>
          <label for="learning-group" class="block text-sm font-semibold text-slate-700 mb-2">กลุ่มสาระการเรียนรู้ / ประเภทบุคลากร</label>
          <select id="learning-group" name="learning_group" required 
                  class="w-full rounded-2xl border border-slate-200/90 bg-slate-50/50 px-4 py-3.5 text-slate-800 focus:bg-white focus:border-emerald-400 focus:ring-4 focus:ring-emerald-100 outline-none transition duration-200 cursor-pointer">
            <option value="" disabled selected>เลือกกลุ่มสาระ / ประเภท...</option>
            <option>ผู้บริหาร</option>
            <option>การงานอาชีพ</option>
            <option>คณิตศาสตร์</option>
            <option>ภาษาไทย</option>
            <option>วิทยาศาสตร์และเทคโนโลยี</option>
            <option>ศิลปะ</option>
            <option>สังคมศึกษา</option>
            <option>ภาษาต่างประเทศ</option>
            <option>สุขศึกษาและพลศึกษา</option>
            <option>แนะแนว</option>
            <option>เจ้าหน้าที่</option>
            <option>พนักงานราชการ</option>
            <option>นักศึกษาฝึกสอน</option>
            <option>อื่น ๆ</option>
          </select>
        </div>

        <!-- ปุ่มยืนยัน -->
        <button id="submit-button" type="submit" 
                class="w-full mt-3 rounded-2xl bg-gradient-to-r from-emerald-500 via-teal-500 to-emerald-600 hover:from-emerald-600 hover:to-teal-600 text-white font-semibold py-4 px-6 shadow-lg shadow-emerald-500/25 hover:shadow-emerald-500/35 transform active:scale-[0.99] transition duration-200 flex justify-center items-center gap-2">
          <span id="submit-ready" class="flex items-center gap-2">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
            ยืนยันการลงชื่อปฏิบัติงาน
          </span>
          <span id="submit-loading" class="hidden flex items-center gap-2">
            <svg class="animate-spin h-5 w-5 text-white" fill="none" viewBox="0 0 24 24">
              <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
              <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8H4z"></path>
            </svg>
            กำลังบันทึกข้อมูล...
          </span>
        </button>
      </form>

    </div>
  </main>

  <footer class="w-full text-center py-6 text-xs text-slate-500">
    © โรงเรียนบางสะพานวิทยา · ระบบลงชื่อปฏิบัติงานออนไลน์
  </footer>

  <script>
    const GOOGLE_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbybkyLWApW9C6m8-W1Oj4_d9QWNhOqEU4mret-SiWpZAOX9hL8Gy4GKHAZxzDbhsaLtkw/exec';

    const form = document.getElementById('attendance-form');
    const prefixSelect = document.getElementById('prefix');
    const firstNameInput = document.getElementById('first-name');
    const lastNameInput = document.getElementById('last-name');
    const groupSelect = document.getElementById('learning-group');
    const submitButton = document.getElementById('submit-button');
    const readyText = document.getElementById('submit-ready');
    const loadingText = document.getElementById('submit-loading');
    const clock = document.getElementById('current-clock');
    const periodDisplay = document.getElementById('current-period');
    const statusBadge = document.getElementById('status-badge');
    const fullDateDisplay = document.getElementById('full-date-display');
    
    let saving = false;

    const thaiDays = ['อาทิตย์', 'จันทร์', 'อังคาร', 'พุธ', 'พฤหัสบดี', 'ศุกร์', 'เสาร์'];
    const thaiFullMonths = [
      'มกราคม', 'กุมภาพันธ์', 'มีนาคม', 'เมษายน', 'พฤษภาคม', 'มิถุนายน',
      'กรกฎาคม', 'สิงหาคม', 'กันยายน', 'ตุลาคม', 'พฤศจิกายน', 'ธันวาคม'
    ];

    function getBangkokDate() {
      const now = new Date();
      const utc = now.getTime() + (now.getTimezoneOffset() * 60000);
      return new Date(utc + (3600000 * 7));
    }

    function getAttendance(date) {
      const hours = date.getHours();
      const minutes = date.getMinutes();
      const seconds = date.getSeconds();
      const morning = hours < 12;
      const totalMinutes = hours * 60 + minutes;

      const isOntime = totalMinutes <= (morning ? (8 * 60 + 30) : (15 * 60 + 30));

      return {
        hours, minutes, seconds,
        dayOfWeek: thaiDays[date.getDay()],
        day: date.getDate(),
        month: thaiFullMonths[date.getMonth()],
        year: date.getFullYear() + 543,
        period: morning ? 'เช้า' : 'เย็น',
        status: isOntime ? 'ตรงเวลา' : 'สาย'
      };
    }

    function updateClock() {
      const t = getAttendance(getBangkokDate());
      fullDateDisplay.textContent = `วัน${t.dayOfWeek}ที่ ${t.day} ${t.month} พ.ศ. ${t.year}`;
      clock.textContent = `${String(t.hours).padStart(2,'0')}:${String(t.minutes).padStart(2,'0')}:${String(t.seconds).padStart(2,'0')} น.`;
      periodDisplay.textContent = `ช่วงเวลา: รอบ${t.period}`;

      if (t.status === 'ตรงเวลา') {
        statusBadge.textContent = '● ปกติ (ตรงเวลา)';
        statusBadge.className = 'inline-block bg-emerald-400/25 border border-emerald-300 text-white px-3 py-1 rounded-xl text-xs font-medium';
      } else {
        statusBadge.textContent = '● เกินเวลา (สาย)';
        statusBadge.className = 'inline-block bg-amber-400/25 border border-amber-300 text-amber-100 px-3 py-1 rounded-xl text-xs font-medium';
      }

      submitButton.disabled = saving;
    }

    function setSaving(state) {
      saving = state;
      readyText.classList.toggle('hidden', state);
      loadingText.classList.toggle('hidden', !state);
      updateClock();
    }

    // จัดการส่งฟอร์ม
    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      if (saving) return;

      const prefix = prefixSelect.value;
      const firstName = firstNameInput.value.trim().replace(/\s+/g, ' ');
      const lastName = lastNameInput.value.trim().replace(/\s+/g, ' ');
      const learningGroup = groupSelect.value;

      // ตรวจสอบความครบถ้วน
      if (!prefix) {
        Swal.fire({
          icon: 'warning',
          title: 'ข้อมูลไม่ครบถ้วน',
          text: 'กรุณาเลือกคำนำหน้าชื่อ',
          confirmButtonColor: '#10b981',
          confirmButtonText: 'ตกลง'
        });
        prefixSelect.focus();
        return;
      }

      if (!firstName) {
        Swal.fire({
          icon: 'warning',
          title: 'ข้อมูลไม่ครบถ้วน',
          text: 'กรุณากรอกชื่อจริง',
          confirmButtonColor: '#10b981',
          confirmButtonText: 'ตกลง'
        });
        firstNameInput.focus();
        return;
      }

      if (!lastName) {
        Swal.fire({
          icon: 'warning',
          title: 'ข้อมูลไม่ครบถ้วน',
          text: 'กรุณากรอกนามสกุล',
          confirmButtonColor: '#10b981',
          confirmButtonText: 'ตกลง'
        });
        lastNameInput.focus();
        return;
      }

      if (!learningGroup) {
        Swal.fire({
          icon: 'warning',
          title: 'ข้อมูลไม่ครบถ้วน',
          text: 'กรุณาเลือกกลุ่มสาระการเรียนรู้หรือประเภทบุคลากร',
          confirmButtonColor: '#10b981',
          confirmButtonText: 'ตกลง'
        });
        groupSelect.focus();
        return;
      }

      // รวมคำนำหน้า + ชื่อ + นามสกุล อย่างเป็นทางการ
      // หากเป็น "ว่าที่ร้อยตรี" จะเว้นวรรคให้ 1 เคาะเพื่อความสวยงาม
      const fullName = (prefix === 'ว่าที่ร้อยตรี') 
        ? `${prefix} ${firstName} ${lastName}`
        : `${prefix}${firstName} ${lastName}`;

      const attendance = getAttendance(getBangkokDate());
      setSaving(true);

      try {
        const response = await fetch(GOOGLE_SCRIPT_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({
            full_name: fullName,
            attendance_period: attendance.period,
            status: attendance.status,
            learning_group: learningGroup
          })
        });

        const result = await response.json();

        if (result.result === 'success') {
          Swal.fire({
            icon: 'success',
            title: 'บันทึกสำเร็จ!',
            html: `
              <div class="text-left text-sm text-slate-600 bg-emerald-50/70 p-4 rounded-2xl border border-emerald-100 mt-2 space-y-1">
                <p><b>ชื่อ-นามสกุล:</b> ${fullName}</p>
                <p><b>กลุ่ม:</b> ${learningGroup}</p>
                <p><b>เวลาที่บันทึก:</b> ${String(attendance.hours).padStart(2,'0')}:${String(attendance.minutes).padStart(2,'0')} น. (ช่วง${attendance.period})</p>
                <p><b>สถานะ:</b> <span class="font-bold ${attendance.status === 'ตรงเวลา' ? 'text-emerald-700' : 'text-amber-700'}">${attendance.status}</span></p>
              </div>
            `,
            confirmButtonColor: '#10b981',
            confirmButtonText: 'เสร็จสิ้น'
          });

          form.reset();
        } else {
          throw new Error(result.error || 'Server error');
        }

      } catch (error) {
        console.error(error);
        Swal.fire({
          icon: 'error',
          title: 'เกิดข้อผิดพลาด!',
          text: 'ไม่สามารถบันทึกข้อมูลได้ กรุณาลองใหม่อีกครั้ง หรือตรวจสอบสัญญาณอินเทอร์เน็ต',
          confirmButtonColor: '#ef4444',
          confirmButtonText: 'ปิด'
        });
      } finally {
        setSaving(false);
      }
    });

    updateClock();
    setInterval(updateClock, 1000);
  </script>
 </body>
</html>
